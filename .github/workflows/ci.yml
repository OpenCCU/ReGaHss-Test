name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'additional OpenCCU-Base ref (branch, tag or commit SHA) to test'
        required: false
        default: ''
      faketime_rate:
        description: 'speed of the faked clock for the timer tests (1: real time as in the nightly run, default: 10 for 64-bit, 1 for 32-bit ReGaHss)'
        required: false
        default: ''
      legacy_occu:
        description: 'additionally run the legacy OCCU (OpenCCU/occu) based tests'
        type: boolean
        default: false
      debug:
        description: 'enter remote debug environment after the tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/openccu/regahss-test

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install dependencies
        run: npm ci --no-audit --no-fund

      - name: lint javascript
        run: npm run lint

      - name: lint shell scripts
        run: shellcheck scripts/*.sh legacy/*.sh

      - name: lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.matrix.outputs.tests }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v6

      - name: resolve OpenCCU-Base revisions
        id: resolve
        env:
          EXTRA_REF: ${{ inputs.base_ref }}
        run: scripts/resolve-base-refs.sh "${EXTRA_REF}"

      - name: build test matrix
        id: matrix
        env:
          REFS: ${{ steps.resolve.outputs.refs }}
          # architectures and library variants to test for each revision
          VARIANTS: >-
            [
              {"arch": "x86_64-linux-gnu", "libs": "prebuilt"},
              {"arch": "x86_64-linux-gnu", "libs": "source"},
              {"arch": "x86_64-linux-gnu", "libs": "asan"},
              {"arch": "i686-linux-gnu", "libs": "prebuilt"},
              {"arch": "i686-linux-gnu", "libs": "source"},
              {"arch": "aarch64-linux-gnu", "libs": "prebuilt"},
              {"arch": "arm-linux-gnueabihf", "libs": "prebuilt"}
            ]
        run: |
          tests=$(jq -c --argjson variants "${VARIANTS}" \
            '[.[] as $base | $variants[] | . + {base_name: $base.name, base_sha: $base.sha, ref_sha: $base.ref_sha}]' <<<"${REFS}")
          images=$(jq -c --argjson variants "${VARIANTS}" \
            '[.[] as $base | $variants[] | select(.libs == "prebuilt") | . + {base_name: $base.name, base_sha: $base.sha}]' <<<"${REFS}")
          echo "tests=${tests}" >>"${GITHUB_OUTPUT}"
          echo "images=${images}" >>"${GITHUB_OUTPUT}"
          jq . <<<"${tests}"

  test:
    name: test (${{ matrix.arch }}, ${{ matrix.libs }}, ${{ matrix.base_name }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.tests) }}
    uses: ./.github/workflows/regahss-test.yml
    with:
      base_ref: ${{ matrix.base_sha }}
      base_name: ${{ matrix.base_name }}
      arch: ${{ matrix.arch }}
      libs: ${{ matrix.libs }}
      # differential tests of the script corpus against the previous ReGaHss
      ref_base_ref: ${{ matrix.libs == 'prebuilt' && matrix.ref_sha || '' }}
      # (the nightly run executes the timer tests in real time)
      faketime_rate: ${{ inputs.faketime_rate || (github.event_name == 'schedule' && '1') || '' }}
      debug: ${{ inputs.debug == true }}

  publish:
    name: publish (${{ matrix.arch }}, ${{ matrix.base_name }})
    needs: [resolve, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'OpenCCU/ReGaHss-Test'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.images) }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        env:
          ARCH: ${{ matrix.arch }}
          BASE_NAME: ${{ matrix.base_name }}
          BASE_SHA: ${{ matrix.base_sha }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${ARCH}-${BASE_SHA:0:7}"
            tr '+' '\n' <<<"${BASE_NAME}" | sed "s|^|${IMAGE_NAME}:${ARCH}-|"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"

      - name: publish test image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_REF=${{ matrix.base_sha }}
            REGA_ARCH=${{ matrix.arch }}
            REGA_LIBS=prebuilt
          cache-from: type=gha,scope=${{ matrix.arch }}-prebuilt

  legacy-occu:
    name: legacy-occu (${{ matrix.flavor }}, X86_32_GCC8)
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_occu
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        flavor: [community, beta]

    steps:
      - uses: actions/checkout@v6

      - name: enable i386 architecture
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update

      - name: set timezone to Europe/Berlin
        run: sudo timedatectl set-timezone Europe/Berlin

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install dependencies
        run: npm ci --no-audit --no-fund

      - name: install OCCU
        run: sudo FLAVOR=${{ matrix.flavor }} ARCH=X86_32_GCC8 legacy/occu-install.sh

      - name: run ReGaHss tests
        run: sudo env "PATH=${PATH}" FLAVOR=${{ matrix.flavor }} legacy/occu-run.sh
