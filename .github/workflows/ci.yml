name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'additional OpenCCU-Base ref (branch, tag or commit SHA) to test'
        required: false
        default: ''
      legacy_occu:
        description: 'additionally run the legacy OCCU (OpenCCU/occu) based tests'
        type: boolean
        default: false
      debug:
        description: 'enter remote debug environment after the tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/openccu/regahss-test

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install dependencies
        run: npm ci --no-audit --no-fund

      - name: lint javascript
        run: npm run lint

      - name: lint shell scripts
        run: shellcheck scripts/*.sh legacy/*.sh

  resolve:
    runs-on: ubuntu-24.04
    outputs:
      refs: ${{ steps.resolve.outputs.refs }}
    steps:
      - uses: actions/checkout@v6

      - name: resolve OpenCCU-Base revisions
        id: resolve
        env:
          EXTRA_REF: ${{ inputs.base_ref }}
        run: scripts/resolve-base-refs.sh "${EXTRA_REF}"

  test:
    name: test (${{ matrix.arch }}, ${{ matrix.base.name }})
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64-linux-gnu, i686-linux-gnu]
        base: ${{ fromJSON(needs.resolve.outputs.refs) }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: regahss-test:ci
          build-args: |
            BASE_REF=${{ matrix.base.sha }}
            REGA_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: run ReGaHss tests
        env:
          REGA_LABEL: ${{ matrix.arch }}@${{ matrix.base.name }}
        run: docker run --rm --init -e REGA_LABEL regahss-test:ci

      - name: remote debug tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ !cancelled() && inputs.debug }}

      - name: login to GitHub container registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'OpenCCU/ReGaHss-Test'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish test image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'OpenCCU/ReGaHss-Test'
        env:
          ARCH: ${{ matrix.arch }}
          BASE_NAME: ${{ matrix.base.name }}
          BASE_SHA: ${{ matrix.base.sha }}
        run: |
          for tag in "${ARCH}-${BASE_SHA:0:7}" $(tr '+' '\n' <<<"${BASE_NAME}" | sed "s/^/${ARCH}-/"); do
            docker tag regahss-test:ci "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done

  legacy-occu:
    name: legacy-occu (${{ matrix.flavor }}, X86_32_GCC8)
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_occu
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        flavor: [community, beta]

    steps:
      - uses: actions/checkout@v6

      - name: enable i386 architecture
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update

      - name: set timezone to Europe/Berlin
        run: sudo timedatectl set-timezone Europe/Berlin

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install dependencies
        run: npm ci --no-audit --no-fund

      - name: install OCCU
        run: sudo FLAVOR=${{ matrix.flavor }} ARCH=X86_32_GCC8 legacy/occu-install.sh

      - name: run ReGaHss tests
        run: sudo env "PATH=${PATH}" FLAVOR=${{ matrix.flavor }} legacy/occu-run.sh
